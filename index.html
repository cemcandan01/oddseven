<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Gri Kutu Futbol</title>
<style>
body{font:14px/1.4 sans-serif;margin:0;background:#e6e6e6;color:#222}
#wrap{display:grid;grid-template-columns:400px 1fr 340px;gap:10px;padding:10px;height:calc(100vh - 20px);box-sizing:border-box}
.box{background:#fafafa;border:1px solid #999;padding:8px;overflow:auto}
h3{margin:0 0 6px}
table.pitch{border-collapse:collapse;width:100%}
table.pitch td.pa{background:#b9d4ad}
.pr{float:right;font-size:10px;color:#555}
table.pitch td{border:1px solid #888;background:#ccc;height:70px;width:33%;vertical-align:top;padding:2px;font-size:12px}
.goal{text-align:center;font-size:12px;color:#555;padding:3px}
.pl{display:inline-block;border:1px solid #444;padding:0 3px;margin:1px;background:#fff;font-weight:bold}
.pl.a{color:#0040c0}.pl.b{color:#c00000}
.pl.outp{opacity:.4;text-decoration:line-through}.pl.ball{background:#ffe680}.pl.dfn{outline:2px dashed #333}
#score{font-size:22px;font-weight:bold}
#meta{font-size:12px;color:#444;margin-bottom:8px}
#prompt button{display:block;width:100%;text-align:left;margin:4px 0;padding:6px;font:inherit;white-space:pre-line;cursor:pointer}
#prompt button small{color:#555}
.info{color:#444;margin-bottom:6px}
table.ro{border-collapse:collapse;width:100%;font-size:11px;margin-top:8px}
table.ro td,table.ro th{border:1px solid #bbb;padding:1px 3px;text-align:left}
#log div{border-bottom:1px solid #ddd;padding:2px 0;font-size:13px}
#log .ok{color:#0a6a0a}#log .bad{color:#a00000}#log .hd{font-weight:bold;background:#ddd}#log .goalok{background:#b9ecb9;font-weight:bold;color:#0a5a0a}#log .goalbad{background:#f2b9b9;font-weight:bold;color:#900000}
</style>
</head>
<body>
<div id="wrap">
  <div class="box"><div class="goal" id="topgoal"></div><table class="pitch" id="pitch"></table><div class="goal" id="botgoal"></div></div>
  <div class="box">
    <div id="score"></div>
    <div id="meta"></div>
    <div id="prompt"></div>
    <div id="roster"></div>
  </div>
  <div class="box"><h3>Maç Günlüğü</h3><div id="log"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const SN={hiz:'Hız',guc:'Güç',pas:'Pas',calim:'Çalım',sut:'Şut',sav:'Savunma',hava:'Hava'};
const KEYS=['hiz','guc','pas','calim','sut','sav','hava'];
const TN={fwd:'Kanatlar ileri',bal:'Dengeli',back:'Geri çekilmiş'};
const CN={ul:'sol üst',ur:'sağ üst',dl:'sol alt',dr:'sağ alt'};
const PERK={ahtapot:'Ahtapot',yengec:'Kral Yengeç',kilic:'Kılıç Balığı',ucan:'Uçan Balık'};
const ROLE={GK:{c:1,d:0},D1:{c:0,d:1},D2:{c:2,d:1},MID:{c:1,d:2},W1:{c:0,d:2},W2:{c:2,d:2},ST:{c:1,d:3}};

// savunma seçenekleri: kullanılan stat ve saldırı türüne göre bonus/ceza
const DEF={
  K:{name:'Kayarak müdahale',stat:'hiz',mod:{cal:1,kor:0,sut:-1}},
  Y:{name:'Yapış',stat:'sav',mod:{cal:0,kor:0}},
  B:{name:'Blokla',stat:'sav',mod:{sut:1}}
};
// rakip niyeti: topu taşıyan oyuncumuzun karesindeki rakibin sonraki hamlesi (etkiler bizim ihtimalimize)
const INT={
  K:{name:'Kayarak müdahale',short:'KAY',eff:'çalıma +2, koruya -2'},
  Y:{name:'Yapış',short:'YAP',eff:'koruya +2, çalıma -2'},
  P:{name:'Pas yolunu kapat',short:'PAS',eff:'uzun pasa -2, kısa pasa ve çalıma +1'},
  B:{name:'Blokla',short:'BLK',eff:'şuta -15'}
};
const AVAIL={cal:['K','Y'],kor:['K','Y'],ic:['K','Y']};

// [rol, ad, kısa ad, hız,güç,pas,çalım,şut,savunma,hava, meyve]
const ROSTER_A=[
  ['GK','Kaleci','KAL',[2,2,3,1,1,3,3],'ahtapot'],
  ['D1','Sol Savunma','SD',[2,4,3,1,1,4,3]],
  ['D2','Sağ Savunma','ŞD',[3,4,2,1,1,4,2]],
  ['MID','Orta Saha','OS',[3,3,5,4,2,3,2]],
  ['W1','Sol Kanat','SK',[5,2,3,4,3,1,3],'ucan'],
  ['W2','Sağ Kanat','ŞK',[4,2,4,3,3,2,2]],
  ['ST','Santrafor','SF',[3,5,2,3,4,1,4],'kilic']
];
const ROSTER_B=[
  ['GK','Kaleci','KAL',[2,3,3,1,1,3,3],'yengec'],
  ['D1','Sol Savunma','SD',[3,4,2,1,1,4,3]],
  ['D2','Sağ Savunma','ŞD',[2,3,3,2,1,5,3]],
  ['MID','Orta Saha','OS',[3,3,4,4,3,3,2]],
  ['W1','Sol Kanat','SK',[4,2,3,5,3,1,2]],
  ['W2','Sağ Kanat','ŞK',[5,2,3,3,2,2,3],'ucan'],
  ['ST','Santrafor','SF',[3,4,2,3,5,1,4],'kilic']
];

function mkTeam(name,cls,human,up,ro){
  const t={name,cls,human,up,score:0,n:0,tac:'bal',pl:[]};
  ro.forEach(r=>{
    const st={};KEYS.forEach((k,i)=>st[k]=r[3][i]);
    if(r[0]==='GK'){st.yakin=3;st.uzak=3;}
    t.pl.push({team:t,role:r[0],name:r[1],short:r[2],st,perk:r[4]||null,hype:0,flame:false,c:0,d:0,out:false,korStreak:0});
  });
  return t;
}
const S={A:mkTeam('Mavi','a',true,true,ROSTER_A),B:mkTeam('Kırmızı','b',false,false,ROSTER_B),min:0,car:null,df:null,intent:null,stats:{A:{shots:0,ont:0,goals:0,wins:0,cols:[0,0,0]},B:{shots:0,ont:0,goals:0,wins:0,cols:[0,0,0]}}};
const full=p=>`${p.team.name} ${p.name}`;
// günlük Mavi'nin gözünden yazılır
const OURS={GK:'Kalecimiz',D1:'Sol savunmamız',D2:'Sağ savunmamız',MID:'Orta sahamız',W1:'Sol kanadımız',W2:'Sağ kanadımız',ST:'Santraforumuz'};
const THEIRS={GK:'Rakip kaleci',D1:'Rakip sol savunma',D2:'Rakip sağ savunma',MID:'Rakip orta saha',W1:'Rakip sol kanat',W2:'Rakip sağ kanat',ST:'Rakip santrafor'};
const OURS_DAT={GK:'Kalecimize',D1:'Sol savunmamıza',D2:'Sağ savunmamıza',MID:'Orta sahamıza',W1:'Sol kanadımıza',W2:'Sağ kanadımıza',ST:'Santraforumuza'};
const THEIRS_DAT={GK:'Rakip kaleciye',D1:'Rakip sol savunmaya',D2:'Rakip sağ savunmaya',MID:'Rakip orta sahaya',W1:'Rakip sol kanada',W2:'Rakip sağ kanada',ST:'Rakip santrafora'};
const who=p=>(p.team===S.A?OURS:THEIRS)[p.role];
const dat=p=>(p.team===S.A?OURS_DAT:THEIRS_DAT)[p.role];
const lc=t=>t[0].toLowerCase()+t.slice(1);
const scr=p=>({x:p.c,y:p.team.up?4-p.d:p.d});
const cheb=(a,b)=>Math.max(Math.abs(a.c-b.c),Math.abs(a.d-b.d));
const fmt=n=>Math.round(n*10)/10;

// takımın taktiğine göre rolün diziliş karesi
function formPos(p){
  const t=p.team;let{c,d}=ROLE[p.role];
  if(p.role!=='GK'){
    if(t.tac==='fwd'&&(p.role==='W1'||p.role==='W2'))d=3;
    if(t.tac==='back'){if(p.role==='MID'||p.role==='W1'||p.role==='W2')d=1;if(p.role==='ST')d=2;}
  }
  return{c,d};
}
// tam sıfırlama (gol, kaleci kurtarışı, top dışarı)
// yapay zeka savunurken orta sütunu korumayı tercih eder (kanatlar yan sütunda kalır)
const aiCenter=(p,possTeam)=>!p.team.human&&p.team!==possTeam&&['D1','D2','MID','ST'].includes(p.role);
function setPositions(possTeam){
  for(const t of [S.A,S.B])for(const p of t.pl){
    const f=formPos(p);p.c=aiCenter(p,possTeam)?1:f.c;p.d=f.d;p.out=false;p.korStreak=0;
  }
}
// top el değiştirdi: topu alan yerinde kalır, diğerleri taktik dizilişine doğru en fazla bir kare kayar
function shiftTeams(carrier){
  for(const t of [S.A,S.B])for(const p of t.pl){
    p.out=false;p.korStreak=0;
    if(p===carrier)continue;
    const f=formPos(p),tc=aiCenter(p,carrier.team)?1:f.c;
    p.c+=Math.sign(tc-p.c);p.d+=Math.sign(f.d-p.d);
  }
}
function stepToward(q,pt){
  const s=scr(q);
  q.c+=Math.sign(pt.x-s.x);
  q.d+=(q.team.up?-1:1)*Math.sign(pt.y-s.y);
}

// --- hype ---
const hs=p=>p.flame?'ALEV 🔥':`Hype ${p.hype}/3`;
function hypeUp(p){
  if(p.flame)return;
  p.hype++;
  if(p.hype>=3){p.hype=3;p.flame=true;log(`🔥 ${who(p)} ALEV aldı!`,p.team===S.A?'ok':'bad');}
}
function lost(p){
  if(p.flame){p.flame=false;p.hype=0;log(`${who(p)} alevini kaybetti. Hype 0/3`,p.team===S.A?'bad':'ok');}
}
// defRisk: savunmanın başarı ihtimali %60'ın altındaysa (riskli) hype verir
function stopped(attP,defP,defRisk){
  const was=attP.flame;
  lost(attP);
  if(was){
    if(!defP.flame){defP.flame=true;defP.hype=3;log(`🔥 ${who(defP)} alevli ${defP.team===S.A?'rakibi':'oyuncumuzu'} durdurdu, direkt ALEV aldı!`,defP.team===S.A?'ok':'bad');}
  }else if(defRisk)hypeUp(defP);
}
const clampP=x=>Math.min(0.9,Math.max(0.1,x));
const isRisky=p=>p<0.6;

// --- statlar ---
function eff(p,k){
  let v=p.st[k];
  if(p.flame&&((p.perk==='kilic'&&k==='guc')||(p.perk==='ucan'&&k==='hava')))v+=2;
  return v;
}
function gkNearFar(gk){
  let n=gk.st.yakin,f=gk.st.uzak;
  if(gk.perk==='ahtapot'){f+=2;n-=1;}
  if(gk.perk==='yengec'){n+=2;f-=1;}
  return{n,f};
}
function roll(p){
  return{win:Math.random()<p,txt:`[ihtimal %${Math.round(p*100)}]`};
}

// --- düello kurulumu ---
function nearestDef(def,pt){
  let best=null,bd=99;
  for(const p of def.pl){
    if(p.role==='GK'||p.out)continue;
    const s=scr(p),d=Math.max(Math.abs(s.x-pt.x),Math.abs(s.y-pt.y));
    if(d<bd||(d===bd&&p.st.sav>best.st.sav)){best=p;bd=d;}
  }
  return{p:best,d:bd};
}
const distMod=d=>d===0?1:d===1?0:d===2?-1:-2;
const activeIntent=(df,dist)=>S.intent&&S.intent.p===df&&dist===0?S.intent:null;
// niyet varken savunmacının seçeneği niyete göre sabit; niyet etkisi seçenek bonusunun yerine geçer
const keyFor=(act,k)=>k==='K'?'K':'Y';
const baseT=a=>a.t==='ic'?'cal':a.t;// içeri kat bir çalım düellosudur
function intentMod(it,act){
  if(!it)return 0;
  const t=baseT(act);
  if(t==='cal')return it.key==='K'?2:it.key==='Y'?-2:it.key==='P'?1:0;
  if(t==='kor')return it.key==='K'?-2:it.key==='Y'?2:0;
  return 0;
}
const sg=v=>(v>0?'+':'')+fmt(v);

// --- başarı formülü: 50 + 10×(hücum statı − savunma statı) + bonuslar − baskı×5, %10-%90 ---
// baskı: aksiyonun yapıldığı karedeki ve komşu karelerdeki rakip sayısı
const PRESS=5;
function pressureOf(def,pt){
  let n=0;
  for(const p of def.pl){
    if(p.out)continue;
    const s=scr(p);
    if(Math.max(Math.abs(s.x-pt.x),Math.abs(s.y-pt.y))<=1)n++;
  }
  return n;
}
// bon: [[etiket, puan], ...] (alev: ±20 = ±2 stat puanı)
function calcP(aLab,av,dLab,dv,bon,press){
  let t=50+10*(av-dv);
  const parts=[`50 + 10×(${aLab} ${fmt(av)} − ${dLab} ${fmt(dv)}) = ${fmt(t)}`];
  for(const[l,v]of bon){if(!v)continue;t+=v;parts.push(`${l} ${sg(v)}`);}
  t-=PRESS*press;
  parts.push(`baskı ${press}×${PRESS} -${PRESS*press}`);
  const p=clampP(t/100);
  return{p,text:`${parts.join(', ')} → %${Math.round(p*100)}`};
}
// çalım / koru / içeri kat: taşıyıcı vs karşısındaki savunmacı
function duelInfo(def,car,df,dist,act,k,it){
  const t=baseT(act),o=DEF[k];
  const bon=[];
  if(car.flame)bon.push(['alev',20]);
  if(df.flame)bon.push(['rakip alevi',-20]);
  if(it)bon.push([`rakip niyeti: ${INT[it.key].name}`,10*intentMod(it,act)]);
  else{const m=o.mod[t]||0;if(m)bon.push([o.name,-10*m]);}
  bon.push([`mesafe ${dist}`,-10*distMod(dist)]);
  if(t==='kor'){bon.push(['koru güvenli',20]);if(car.korStreak)bon.push(['art arda koru',-15*car.korStreak]);}
  const a=t==='kor'?['Güç',eff(car,'guc')]:['Çalım',eff(car,'calim')];
  return calcP(a[0],a[1],`${df.name} ${SN[o.stat]}`,eff(df,o.stat),bon,pressureOf(def,scr(car)));
}
// ceza sahası: kalecinin bulunduğu sıra + hemen önündeki sıranın orta karesi
const isPenaltyCell=(x,y)=>y===0||y===4||(x===1&&(y===1||y===3));
const inPenalty=car=>car.d===4||(car.d===3&&car.c===1);
// şut: şutçunun Şut statı vs kalecinin köşe statı; ceza sahası, açı, blok ve baskı bonus/ceza
function shotInfo(def,car,corner,blocked){
  const gk=def.pl[0],{n,f}=gkNearFar(gk);
  const top=corner[0]==='u',side=corner[1];
  const nearSide=car.c===0?'l':car.c===2?'r':null;// kaleci topun sütunundaki tarafa yakın durur
  let gv,gt;
  if(nearSide===null){gv=(n+f)/2;gt='orta sütun (yakın/uzak ort.)';}
  else if(side===nearSide){gv=n;gt='yakın köşe';}
  else{gv=f;gt='uzak köşe';}
  if(top)gv-=1;
  const av=top?eff(car,'sut'):(eff(car,'sut')+eff(car,'guc'))/2;
  const pa=inPenalty(car),press=pressureOf(def,scr(car));
  const mk=blk=>{
    const bon=[];
    if(car.flame)bon.push(['alev',20]);
    if(gk.flame)bon.push(['kaleci alevi',-20]);
    bon.push(pa?['ceza sahası içi',-5]:['ceza sahası dışı',-35]);
    if(car.c!==1)bon.push(['yan sütun açı cezası (-2)',-20]);
    if(blk)bon.push(['blok',-15]);
    return calcP(top?'Şut':'Şut/Güç ort.',av,`kaleci ${gt}${gk.perk?' ('+PERK[gk.perk]+')':''}${top?' (üst -1)':''}`,gv,bon,press);
  };
  const a=mk(blocked),b=mk(false);
  return{p:a.p,pNo:b.p,text:a.text};
}
const CORNERS=['ul','ur','dl','dr'];
const bestCorner=(def,p)=>CORNERS.reduce((b,c)=>shotInfo(def,p,c,false).p>shotInfo(def,p,b,false).p?c:b);
// --- pas: ihtimal tamamen konuma bağlı (yüzde puanı olarak toplanır) ---
function passInfo(def,car,to){
  const a=scr(car),b=scr(to),n=Math.max(Math.abs(a.x-b.x),Math.abs(a.y-b.y));
  const live=def.pl.filter(p=>!p.out);
  const at=(x,y)=>live.filter(p=>{const s=scr(p);return s.x===x&&s.y===y;});
  const recv=at(b.x,b.y),path=[];
  for(let i=1;i<n;i++)path.push(...at(Math.round(a.x+(b.x-a.x)*i/n),Math.round(a.y+(b.y-a.y)*i/n)));
  const base=48+8*eff(car,'pas');
  let tot=base;const parts=[`Pas ${eff(car,'pas')} = %${base}`,`uzaklık ${n}${n?' -'+7*n:''}`];
  tot-=7*n;
  if(recv.length){const v=15*recv.length;tot-=v;parts.push(`alıcının karesinde ${recv.length} rakip -${v}`);}
  if(path.length){const v=8*path.length;tot-=v;parts.push(`pas yolunda ${path.length} rakip -${v}`);}
  if(!recv.length&&!path.length)parts.push('markaj yok');
  if(S.intent&&S.intent.key==='P'){const m=8*(n>=3?-2:1);tot+=m;parts.push(`rakip niyeti: ${INT.P.name} ${sg(m)}`);}
  const ctl=2*(eff(to,'calim')-3);
  if(ctl){tot+=ctl;parts.push(`alıcı kontrolü (Çalım ${eff(to,'calim')}) ${sg(ctl)}`);}
  if(n>=3){const v=3*(eff(to,'hava')-3);if(v){tot+=v;parts.push(`Hava ${eff(to,'hava')} ${sg(v)}`);}}
  if(car.flame){tot+=10;parts.push('alev +10');}
  const pr=pressureOf(def,a);
  tot-=PRESS*pr;parts.push(`baskı ${pr}×${PRESS} -${PRESS*pr}`);
  const p=clampP(tot/100);
  return{p,recv,path,text:parts.join(', ')+` → %${Math.round(p*100)}`};
}
// orta aç (sadece yan sütun): ceza sahasındaki en iyi (Hava) takım arkadaşı vs en yakın savunmacı, Hava düellosu
function crossInfo(def,car){
  if(car.c===1)return null;
  const box=car.team.pl.filter(p=>p!==car&&p.role!=='GK'&&inPenalty(p));
  if(!box.length)return null;
  const tgt=box.reduce((b,x)=>eff(x,'hava')>eff(b,'hava')?x:b);
  const q=nearestDef(def,scr(tgt)).p;
  const bon=[];
  if(tgt.flame)bon.push(['alev',20]);
  if(q.flame)bon.push(['rakip alevi',-20]);
  if(car.perk==='ucan'&&car.flame)bon.push(['Uçan Balık alevi (+2)',20]);
  const r=calcP(`${tgt.name} Hava`,eff(tgt,'hava'),`${q.name} Hava`,eff(q,'hava'),bon,pressureOf(def,scr(tgt)));
  return{tgt,q,p:r.p,text:r.text};
}
// rakip en iyi savunmayı seçerse ihtimal ve dökümü
function atkInfo(def,car,act){
  if(act.t==='pas')return passInfo(def,car,act.to);
  if(act.t==='cross')return crossInfo(def,car);
  const nd=nearestDef(def,scr(car));
  const it=activeIntent(nd.p,nd.d);
  if(act.t==='sut'){
    const sh=shotInfo(def,car,act.corner,!!(it&&it.key==='B'));
    return{p:sh.p,text:sh.text};
  }
  let best=null;
  for(const k of (it?[keyFor(act,it.key)]:AVAIL[act.t])){const r=duelInfo(def,car,nd.p,nd.d,act,k,it);if(!best||r.p<best.p)best=r;}
  return best;
}
const atkPct=(def,car,act)=>Math.round(atkInfo(def,car,act).p*100);

const past={
  pas:(a)=>`${a.to.name} oyuncusuna pas verdi`,
  cal:()=>'çalım attı',
  ic:()=>'içeri kat yaptı',
  kor:()=>'topu korudu',
  sut:(a)=>`${CN[a.corner]} köşeye şut çekti`
};
const pres={
  cal:()=>'çalım atmaya çalışıyor',
  ic:()=>'içeri kat yapmaya çalışıyor',
  kor:()=>'topu korumaya çalışıyor',
  sut:(a)=>`${CN[a.corner]} köşeye şut çekiyor`
};

// --- arayüz ---
function log(t,cls){const d=document.createElement('div');d.textContent=`${S.min}' ${t}`;if(cls)d.className=cls;$('log').appendChild(d);$('log').scrollTop=1e9;}
function idle(t){$('prompt').textContent=t;}
function ask(title,info,opts){
  return new Promise(res=>{
    const P=$('prompt');P.innerHTML='';
    const h=document.createElement('h3');h.textContent=title;P.append(h);
    if(info){const i=document.createElement('div');i.className='info';i.textContent=info;P.append(i);}
    opts.forEach((o,i)=>{
      const b=document.createElement('button');
      b.textContent=o.label+(o.pct!=null?`  —  %${o.pct}`:'')+(o.note?`\n${o.note}`:'');
      b.onclick=()=>{P.innerHTML='';res(i);};
      P.append(b);
    });
  });
}
async function choose(title,info,opts){
  if(opts.length===1){log(`(Tek seçenek: ${opts[0].label} otomatik seçildi)`);return 0;}
  return ask(title,info,opts);
}
function render(){
  const A=S.A,B=S.B;
  $('score').textContent=`${A.name} ${A.score} - ${B.score} ${B.name}   ⏱ ${S.min}'`;
  $('meta').textContent=`Dakika ${S.min}/90 · Top: ${S.car?full(S.car):'-'}${S.intent?` · Rakip niyeti: ${full(S.intent.p)} → ${INT[S.intent.key].name}`:''} · Taktik: ${A.name} "${TN[A.tac]}", ${B.name} "${TN[B.tac]}"`;
  $('topgoal').textContent='▲ Kırmızı kalesi (Mavi buraya hücum eder) · yeşil kareler: ceza sahası';
  $('botgoal').textContent='▼ Mavi kalesi';
  let h='';
  for(let y=0;y<5;y++){
    h+='<tr>';
    for(let x=0;x<3;x++){
      h+=`<td${isPenaltyCell(x,y)?' class="pa"':''}>`;
      if(S.car)h+=`<span class="pr" title="${(S.car.team===A?B:A).name} baskısı">B${pressureOf(S.car.team===A?B:A,{x,y})}</span>`;
      for(const t of [B,A])for(const p of t.pl){
        const s=scr(p);
        if(s.x===x&&s.y===y)h+=`<span class="pl ${t.cls}${p.out?' outp':''}${p===S.car?' ball':''}${p===S.df?' dfn':''}">${p.short}${S.intent&&S.intent.p===p?`[${INT[S.intent.key].short}]`:''}${p===S.car?'●':''}${p.flame?'🔥':'·'+p.hype}</span>`;
      }
      h+='</td>';
    }
    h+='</tr>';
  }
  $('pitch').innerHTML=h;
  let r='';
  for(const t of [A,B]){
    r+=`<table class="ro"><tr><th colspan="3">${t.name}${t.human?' (sen)':' (yapay zeka)'}</th></tr>`;
    for(const p of t.pl){
      const st=KEYS.map(k=>SN[k][0]+p.st[k]).join(' ')+(p.role==='GK'?` Y${p.st.yakin} U${p.st.uzak}`:'');
      r+=`<tr><td>${p.short} ${p.name}${p.perk?' <i>('+PERK[p.perk]+')</i>':''}</td><td>${st}</td><td>${hs(p)}</td></tr>`;
    }
    r+='</table>';
  }
  $('roster').innerHTML=r;
}

// --- aksiyon çözümü ---
// cl: eylemi yapan Mavi ise başarı yeşil / başarısızlık kırmızı; rakipse tersi
const cl=(actor,success)=>(actor.team===S.A)===success?'ok':'bad';
// dönüş: {car} aynı takımda devam | {turn:oyuncu} top el değiştirdi | {restart:{team,role,why}} sıfırlama
async function resolvePass(att,def,car,act){
  const to=act.to,pi=passInfo(def,car,to);
  S.df=null;
  const head=`${who(car)} ${lc(dat(to))} pas verdi!`;
  const r=roll(pi.p);
  car.korStreak=0;
  if(r.win){
    const gives=isRisky(pi.p);
    if(gives)hypeUp(car);
    log(`${head} ${r.txt}. Başarılı. ${hs(car)}${gives?'':' (güvenli hamle, hype yok)'}`,cl(car,true));
    return{car:to};
  }
  // sadece alıcının karesindeki veya pas yolundaki rakipler kesebilir
  const hits=[...pi.recv.map(p=>({p,w:'recv'})),...pi.path.map(p=>({p,w:'path'}))];
  if(hits.length){
    const h=hits[rnd(hits.length)];
    S.df=h.p;
    stopped(car,h.p,isRisky(1-pi.p));
    log(`${head} ${r.txt}. ${who(h.p)} ${h.w==='path'?'pas yolundaydı ve topu kesti':'alıcıyı markaj ediyordu ve topu kesti'}! ${who(car)}: ${hs(car)} · ${who(h.p)}: ${hs(h.p)}`,cl(car,false));
    return{turn:h.p};
  }
  // rakip yok: top rakibe geçmez, alıcı kötü kontrol eder, Hız düellosu
  lost(car);
  const q=nearestDef(def,scr(to)).p;
  S.df=q;render();
  const hb=[];if(to.flame)hb.push(['alev',20]);if(q.flame)hb.push(['rakip alevi',-20]);
  const pd=calcP('Hız',eff(to,'hiz'),'rakip Hız',eff(q,'hiz'),hb,pressureOf(def,scr(to))).p;
  const r2=roll(pd);
  const duel=`Hız düellosu: ${who(to)} ${eff(to,'hiz')} - ${lc(who(q))} ${eff(q,'hiz')} ${r2.txt}`;
  if(r2.win){
    log(`${head} ${r.txt}. Yolda rakip yoktu ama ${lc(who(to))} kötü kontrol etti, top boşta! ${duel} — topu ${lc(who(to))} aldı.`,cl(car,true));
    return{car:to};
  }
  if(isRisky(1-pd))hypeUp(q);
  stepToward(q,scr(to));
  log(`${head} ${r.txt}. Yolda rakip yoktu ama ${lc(who(to))} kötü kontrol etti, top boşta! ${duel} — ${who(q)} topu kaptı. ${hs(q)}`,cl(car,false));
  return{turn:q};
}

async function resolveCross(att,def,car,act){
  const ci=crossInfo(def,car),tgt=ci.tgt,q=ci.q;
  S.df=q;render();
  const r=roll(ci.p);
  const head=`${who(car)} ortaladı! ${who(tgt)} ile ${lc(who(q))} Hava düellosuna çıktı`;
  car.korStreak=0;
  if(r.win){
    lost(q);
    if(isRisky(ci.p))hypeUp(tgt);
    log(`${head} ${r.txt}. ${who(tgt)} kazandı ve şut çekiyor! ${hs(tgt)}`,cl(car,true));
    S.intent=null;
    return resolveShot(att,def,tgt,{t:'sut',corner:bestCorner(def,tgt)});
  }
  stopped(tgt,q,isRisky(1-ci.p));
  if(Math.random()<0.5){
    log(`${head} ${r.txt}. ${who(q)} uzaklaştırdı ve topu kaptı! ${who(tgt)}: ${hs(tgt)}`,cl(car,false));
    return{turn:q};
  }
  log(`${head} ${r.txt}. ${who(q)} uzaklaştırdı, top dışarı çıktı! ${who(tgt)}: ${hs(tgt)}`,cl(car,false));
  return{restart:{team:def,role:'GK',why:`Top dışarı çıktı: ${lc(who(def.pl[0]))} topu oyuna sokuyor.`}};
}

async function resolveShot(att,def,car,act){
  const gk=def.pl[0],nd=nearestDef(def,scr(car)),df=nd.p;
  const st=S.stats[att===S.A?'A':'B'];st.shots++;
  S.df=nd.d===0?df:null;render();
  // sadece şutçunun karesindeki ve "Blokla" niyetli/seçen savunmacı bloklayabilir
  let blocked=false,byIntent=false;
  const it=activeIntent(df,nd.d);
  if(it){blocked=it.key==='B';byIntent=blocked;}
  else if(def.human&&nd.d===0){
    const a=shotInfo(def,car,act.corner,false),b=shotInfo(def,car,act.corner,true);
    const i=await ask(`SAVUNMA: ${full(car)} ${pres.sut(act)}`,`${df.name} şutçuyla aynı karede; blok yapabilirsin. Yüzde = şutu durdurma ihtimali.`,[
      {label:'Blokla',pct:Math.round((1-b.p)*100),note:`şut ihtimali -15\n${b.text}`},
      {label:'Bloklama (kaleciye bırak)',pct:Math.round((1-a.p)*100),note:a.text}]);
    blocked=i===0;
  }
  idle('...');
  const sh=shotInfo(def,car,act.corner,blocked),r=roll(sh.p);
  const head=`${who(car)} ${past.sut(act)}!${blocked?` ${who(df)} ${byIntent?'niyetini uyguladı (Blokla)':'bloka çıktı'}.`:''}`;
  if(r.win){
    lost(gk);if(blocked)lost(df);
    const gives=isRisky(sh.p);
    if(gives)hypeUp(car);
    att.score++;st.ont++;st.goals++;
    log(`GOL! ${head} ${r.txt}. Skor: ${S.A.name} ${S.A.score} - ${S.B.score} ${S.B.name}. ${who(car)}: ${hs(car)}${gives?'':' (güvenli şut, hype yok)'}`,att===S.A?'goalok':'goalbad');
    for(const p of att.pl)hypeUp(p);
    log(`${att===S.A?'Tüm takımımız':'Rakibin tüm takımı'} +1 hype aldı.`,cl(car,true));
    return{restart:{team:def,role:'MID',why:`Santra: ${def===S.A?'biz':'rakip'} başlıyor.`}};
  }
  // başarısızlık: blok varsa payı oranında bloker, yoksa kaleci durdurur
  const share=blocked?(sh.pNo-sh.p)/(1-sh.p):0;
  if(Math.random()<share){
    lost(gk);
    stopped(car,df,isRisky(1-sh.p));
    if(Math.random()<0.5){
      log(`${head} ${r.txt}. ${who(df)} şutu engelledi ve topu kaptı! ${who(car)}: ${hs(car)}`,cl(car,false));
      return{turn:df};
    }
    log(`${head} ${r.txt}. ${who(df)} şutu engelledi, top dışarı çıktı! ${who(car)}: ${hs(car)}`,cl(car,false));
    return{restart:{team:def,role:'GK',why:`Kale vuruşu: ${lc(who(gk))} topu oyuna sokuyor.`}};
  }
  if(blocked)lost(df);
  st.ont++;
  stopped(car,gk,isRisky(1-sh.p));
  log(`${head} ${r.txt}. ${who(gk)} kurtardı! ${who(gk)}: ${hs(gk)} · ${who(car)}: ${hs(car)}`,cl(car,false));
  return{restart:{team:def,role:'GK',why:`${who(gk)} topu oyuna sokuyor.`}};
}

async function resolve(att,def,car,act){
  if(act.t==='pas')return resolvePass(att,def,car,act);
  if(act.t==='sut')return resolveShot(att,def,car,act);
  if(act.t==='cross')return resolveCross(att,def,car,act);
  const nd=nearestDef(def,scr(car)),df=nd.p,dist=nd.d;
  S.df=df;render();
  const it=activeIntent(df,dist);
  const keys=it?[keyFor(act,it.key)]:AVAIL[act.t];
  const pi2=keys.map(k=>duelInfo(def,car,df,dist,act,k,it));
  const pa=pi2.map(x=>x.p);
  let key;
  if(def.human){
    if(dist>=3){
      key=keys[pa.indexOf(Math.min(...pa))];
      log(`${who(df)} çok uzaktaydı; ${DEF[key].name} denedi.`);
    }else{
      const i=await choose(`SAVUNMA: ${full(car)} ${pres[act.t](act)}`,
        `Karşındaki: ${df.name} (uzaklık ${dist}). `+(act.t==='sut'?'Yüzde = şutu blokla engelleme ihtimali (sonra kaleci var).':'Yüzde = onu durdurma ihtimali.'),
        keys.map((k,j)=>({label:DEF[k].name,pct:Math.round((1-pa[j])*100),note:`${pi2[j].text} → durdurma %${Math.round((1-pa[j])*100)}`})));
      key=keys[i];
    }
  }else{
    let j=pa.indexOf(Math.min(...pa));
    if(Math.random()<0.15)j=rnd(keys.length);
    key=keys[j];
  }
  idle('...');
  const head=`${who(car)} ${past[act.t](act)}! ${who(df)} ${it?`niyetini uyguladı (${INT[it.key].name})`:`${DEF[key].name} yaptı`}`;
  const p1=pa[keys.indexOf(key)];
  const gk=def.pl[0];

  const r=roll(p1);
  if(!r.win){
    stopped(car,df,isRisky(1-p1));
    if(act.t==='kor')car.korStreak++;
    log(`${head} ${r.txt}. Başarısız! ${who(df)} topu kaptı. ${who(car)}: ${hs(car)} · ${who(df)}: ${hs(df)}`,cl(car,false));
    return{turn:df};
  }
  lost(df);
  // Koru hiç hype vermez; diğerleri yalnızca riskliyse (<%60) verir
  const gives=act.t!=='kor'&&isRisky(p1);
  if(gives)hypeUp(car);
  log(`${head} ${r.txt}. Başarılı. ${hs(car)}${act.t==='kor'?' (koru: hype yok)':gives?'':' (güvenli hamle, hype yok)'}`,cl(car,true));
  if(act.t==='cal'){
    car.korStreak=0;
    const left=df.team.pl.filter(p=>p.role!=='GK'&&!p.out).length;
    if(left>1){df.out=true;log(`${who(df)} bu atak boyunca devre dışı kaldı.`,cl(car,true));}
    car.d=Math.min(4,car.d+1);
    log(`${who(car)} bir sıra ilerledi.`);
  }else if(act.t==='ic'){
    car.korStreak=0;car.c=1;
    log(`${who(car)} orta sütuna geçti.`);
  }else{
    car.korStreak++;
    const near=nearestDef(def,scr(car));
    if(near.d>0){
      stepToward(near.p,scr(car));
      log(`${who(near.p)} yaklaştı.`,cl(car,false));
    }
  }
  if(act.t==='cal'&&key==='K'){car.d=Math.min(4,car.d+1);log(`${who(car)} müdahaleyi atlatıp bir sıra daha ilerledi.`);}
  return{car};
}

// --- seçim menüleri ---
async function humanAttack(att,def,car){
  const kinds=[],opts=[];
  const mates=att.pl.filter(p=>p!==car);
  const passInfos=mates.map(p=>passInfo(def,car,p));
  const bp=passInfos.reduce((b,x)=>x.p>b.p?x:b);
  kinds.push('pas');opts.push({label:'Pas',pct:Math.round(bp.p*100),note:'en iyi hedefin yüzdesi; top alıcının karesine gider\n'+bp.text});
  const ci=atkInfo(def,car,{t:'cal'}),ki=atkInfo(def,car,{t:'kor'});
  kinds.push('cal');opts.push({label:'Çalım',pct:Math.round(ci.p*100),note:'riskli; başarılıysa rakip bu atak boyunca düşer, bir sıra ilerlersin\n'+ci.text});
  kinds.push('kor');opts.push({label:'Topu koru',pct:Math.round(ki.p*100),note:'güvenli ama rakip yaklaşır, hype yok; art arda -%15\n'+ki.text});
  const cs=['ul','ur','dl','dr'];
  if(car.d>=3){
    const si=cs.map(c=>atkInfo(def,car,{t:'sut',corner:c}));
    const bs=si.reduce((b,x)=>x.p>b.p?x:b);
    kinds.push('sut');opts.push({label:'Şut',pct:Math.round(bs.p*100),note:(inPenalty(car)?'ceza sahası içi':'ceza sahası dışı (düşük ihtimal)')+(car.c!==1?'; yan sütun: açı cezası -2':'')+'; köşeyi sonra seçeceksin\n'+bs.text});
  }
  if(car.c!==1){
    const ii=atkInfo(def,car,{t:'ic'});
    kinds.push('ic');opts.push({label:'İçeri kat',pct:Math.round(ii.p*100),note:'çalım düellosu; başarılıysa orta sütundaki komşu kareye geçersin\n'+ii.text});
    const xi=crossInfo(def,car);
    if(xi)kinds.push('cross'),opts.push({label:'Orta aç',pct:Math.round(xi.p*100),note:`ceza sahasında ${xi.tgt.name} (${xi.tgt.short}) ile ${xi.q.name} arasında Hava düellosu; kazanırsan ${xi.tgt.name} şut çeker (en iyi köşe %${Math.round(shotInfo(def,xi.tgt,bestCorner(def,xi.tgt),false).p*100)}), kaybedersen top uzaklaştırılır\n`+xi.text});
  }
  const itTxt=S.intent?`Rakip niyeti: ${full(S.intent.p)} → ${INT[S.intent.key].name} (bizde ${INT[S.intent.key].eff}). `:'';
  const i=await choose(`${full(car)} topta — ne yapacak?`,itTxt+'Yüzdeler rakip en iyi savunmayı seçerse hesaplanır.',opts);
  const k=kinds[i];
  if(k==='pas'){
    const j=await ask('Pas hedefi','Uzaklık ve markaj ihtimali düşürür; boştaki oyuncu en güvenlisi.',
      mates.map((p,x)=>({label:`${p.name} (${p.short})`,pct:Math.round(passInfos[x].p*100),note:passInfos[x].text+` | ${hs(p)}`})));
    return{t:'pas',to:mates[j]};
  }
  if(k==='sut'){
    const j=await ask('Şut köşesi','Kaleci: yakın köşe '+gkNearFar(def.pl[0]).n+', uzak köşe '+gkNearFar(def.pl[0]).f+' (perk dahil); kaleci topun sütunundaki tarafa yakın durur. Üst köşe: Şut statı, kaleci -1. Alt köşe: Şut ve Güç ortalaması.',
      cs.map(c=>{const i=atkInfo(def,car,{t:'sut',corner:c});return{label:CN[c][0].toUpperCase()+CN[c].slice(1),pct:Math.round(i.p*100),note:i.text};}));
    return{t:'sut',corner:cs[j]};
  }
  return{t:k};
}
function aiAttack(att,def,car){
  const c=[];
  // değer: hamlenin getirisi; pas topu alıcının karesine götürür
  for(const p of att.pl)if(p!==car){const a={t:'pas',to:p},g=p.d-car.d;c.push({a,pct:atkPct(def,car,a),v:g>0?1.4:g===0?0.8:0.4});}
  c.push({a:{t:'cal'},pct:atkPct(def,car,{t:'cal'}),v:car.d<4?2:1});
  c.push({a:{t:'kor'},pct:atkPct(def,car,{t:'kor'}),v:0.3});
  if(car.d>=3)for(const cr of ['ul','ur','dl','dr']){const a={t:'sut',corner:cr};c.push({a,pct:atkPct(def,car,a),v:4});}
  if(car.c!==1){
    c.push({a:{t:'ic'},pct:atkPct(def,car,{t:'ic'}),v:1.2});
    const xi=crossInfo(def,car);
    if(xi)c.push({a:{t:'cross'},pct:Math.round(xi.p*100),v:3});
  }
  // risk iştahı: hype yüksekse ve skor gerideyse artar (üs küçüldükçe ihtimal yerine değer ağır basar)
  let risk=0.1+(att.score<def.score?0.25:0)+(car.flame?0.2:car.hype*0.07);
  risk=Math.min(0.6,risk);
  if(Math.random()<0.1)return c[rnd(c.length)].a;// tam rastgele hamle
  let best=null,bu=-1;
  for(const x of c){
    const u=Math.pow(x.pct/100,1-risk)*x.v*(0.7+Math.random()*0.6);
    if(u>bu){bu=u;best=x;}
  }
  return best.a;
}

// --- rakip niyeti: topu taşıyanın karesindeki rakip, oyuncunun statlarına ve hype'ına göre seçer ---
function pickIntent(def,car){
  const nd=nearestDef(def,scr(car));
  if(nd.d!==0)return null;
  const df=nd.p,canShoot=car.d>=3;
  if(Math.random()<0.15){const ks=canShoot?['K','Y','P','B']:['K','Y','P'];return{p:df,key:ks[rnd(ks.length)]};}// tam rastgele
  const far=Math.max(...car.team.pl.filter(p=>p!==car).map(p=>cheb(car,p)))>=3?1:0;
  const w={
    Y:(eff(car,'calim')+(car.flame?1.5:0)+0.3*car.hype)*(1+0.1*eff(df,'sav')),// çalıma yatkın -> Yapış
    K:eff(car,'guc')*0.8*(1+0.1*eff(df,'hiz')),// koruma ihtimali -> Kayarak
    P:(eff(car,'pas')+far)*(1+0.1*eff(df,'sav'))// uzun pas ihtimali -> yolu kapat
  };
  if(canShoot)w.B=(eff(car,'sut')+(car.d===4?2:0)+(car.flame?1.5:0))*(1+0.1*eff(df,'sav'));// şut tehdidi -> Blokla
  let key=null,bw=-1;
  for(const k in w){const v=w[k]*(0.7+Math.random()*0.6);if(v>bw){bw=v;key=k;}}
  return{p:df,key};
}

// --- taktik (sadece ölü toplarda) ---
async function tacticPhase(){
  const me=S.A,ai=S.B;
  const i=await ask('Ölü top — hoca taktiği',`Şu an: ${TN[me.tac]}`,[
    {label:'Kanatları ileri koştur',note:'Kanatlar bir sıra önde: kanatlara pas kısa, ama geride az oyuncu kalır (rakip çalım/şutta savunmacı uzak kalır).'},
    {label:'Dengeli',note:'Standart dizilim.'},
    {label:'Takımı geri çek',note:'Orta saha ve kanatlar geride, santrafor bir sıra geri: savunma yakın, ama ileri paslar uzun ve riskli.'}
  ]);
  me.tac=['fwd','bal','back'][i];
  const diff=ai.score-me.score,r=Math.random();
  if(diff<0)ai.tac=r<.5?'fwd':r<.8?'bal':'back';
  else if(diff>0)ai.tac=r<.4?'back':r<.8?'bal':'fwd';
  else ai.tac=r<.3?'fwd':r<.7?'bal':'back';
  log(`Taktikler: ${me.name} "${TN[me.tac]}", ${ai.name} "${TN[ai.tac]}"`);
}

// sıfırlama: oyuncular dizilişe döner, top verilen takımın verilen rolünde başlar
async function restart(team,role,why){
  log(why);
  await tacticPhase();
  setPositions(team);
  S.car=team.pl.find(p=>p.role===role);S.df=null;
  render();
}

async function main(){
  render();
  await restart(S.A,'MID','Hakem düdüğü, maç başlıyor! Santra bizde.');
  while(S.min<90){
    const car=S.car,att=car.team,def=att===S.A?S.B:S.A;
    S.df=null;
    S.intent=att.human?pickIntent(def,car):null;
    if(S.intent)log(`Rakip niyeti: ${who(S.intent.p)} → ${INT[S.intent.key].name}.`);
    render();
    let act;
    if(att.human)act=await humanAttack(att,def,car);
    else{
      idle(`${full(car)} düşünüyor...`);await sleep(500);
      act=aiAttack(att,def,car);
    }
    S.min+=3;// her hamle 3 dakika
    S.stats[att===S.A?'A':'B'].cols[car.c]++;
    const res=await resolve(att,def,car,act);
    S.intent=null;
    if(res.restart)await restart(res.restart.team,res.restart.role,res.restart.why);
    else if(res.turn){S.car=res.turn;S.stats[res.turn.team===S.A?'A':'B'].wins++;shiftTeams(res.turn);}
    else S.car=res.car;
    S.df=null;render();
    if(!att.human)await sleep(400);
  }
  S.car=null;render();
  const w=S.A.score>S.B.score?'Mavi kazandı!':S.A.score<S.B.score?'Kırmızı kazandı!':'Berabere!';
  const txt=`MAÇ BİTTİ — ${S.A.name} ${S.A.score} - ${S.B.score} ${S.B.name} · ${w} · Maç süresi: ${S.min} dk`;
  log(txt,S.A.score>=S.B.score?'goalok':'goalbad');
  $('prompt').innerHTML='';
  const h=document.createElement('h3');h.textContent=txt;$('prompt').append(h);
  const info=document.createElement('div');info.className='info';info.textContent='Yeniden oynamak için sayfayı yenile (F5).';$('prompt').append(info);
  const a=S.stats.A,b=S.stats.B;
  const rows=[['Şut',a.shots,b.shots],['İsabetli şut',a.ont,b.ont],['Gol',a.goals,b.goals],['Top kazanma',a.wins,b.wins],['Sol sütunda hamle',a.cols[0],b.cols[0]],['Orta sütunda hamle',a.cols[1],b.cols[1]],['Sağ sütunda hamle',a.cols[2],b.cols[2]]];
  const tb=document.createElement('table');tb.className='ro';
  tb.innerHTML=`<tr><th>İstatistik</th><th>${S.A.name}</th><th>${S.B.name}</th></tr>`+rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('');
  $('prompt').append(tb);
  log(`İstatistik — ${rows.map(r=>`${r[0]}: ${r[1]}-${r[2]}`).join(' · ')}`);
}
main();
</script>
